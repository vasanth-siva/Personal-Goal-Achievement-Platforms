spring.application.name=goalforge-backend
server.port=8080

# ==============================================================================
# Database Configuration (MySQL Database)
# ==============================================================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/goal_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
goalforge.jwt.secret=${JWT_SECRET:GoalForgeSuperSecureSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Security!}
goalforge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# CORS Configuration
# ==============================================================================
goalforge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ==============================================================================
# Demo Data Configuration (Default: false for clean databases)
# ==============================================================================
goalforge.demo-data.enabled=${DEMO_DATA_ENABLED:false}
