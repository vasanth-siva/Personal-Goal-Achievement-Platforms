spring.application.name=goalforge-backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

goalforge.jwt.secret=GoalForgeSuperSecureSecretKeyThatIsAtLeast256BitsLongForHMACSHA256Security!
goalforge.jwt.expiration-ms=86400000

goalforge.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
goalforge.demo-data.enabled=false
